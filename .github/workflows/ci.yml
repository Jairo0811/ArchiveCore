name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main, "phase/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore ArchiveCore.slnx
      - run: dotnet build ArchiveCore.slnx -c Release --no-restore
      - run: dotnet test ArchiveCore.slnx -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
