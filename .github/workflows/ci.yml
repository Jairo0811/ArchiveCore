name: CI

on:
  push:
    branches: [main, "release/**", "hardening/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    name: Backend (build, unit + SQL Server integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ArchiveCore.slnx

      - name: Build (Release)
        run: dotnet build ArchiveCore.slnx -c Release --no-restore -warnaserror

      # Integration tests start SQL Server 2022 with Testcontainers and run the repository
      # scripts (01..10) on a clean database: triggers, SESSION_CONTEXT, procedures,
      # filtered indexes and rowversion are exercised against the real engine.
      - name: Test
        run: >
          dotnet test ArchiveCore.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              counters = ET.parse(path).getroot().find("t:ResultSummary/t:Counters", ns)
              summary = {k: counters.get(k) for k in ("total", "passed", "failed", "notExecuted")}
              print(path, summary)
              with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"### Backend tests\n\n{summary}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults
          retention-days: 14

      - name: Vulnerable packages (fails on High/Critical)
        run: |
          dotnet list ArchiveCore.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -Eq '\b(High|Critical)\b' vulnerable.txt; then
            echo "::error::High or Critical NuGet vulnerabilities found"; exit 1
          fi

      - name: Outdated packages (informational)
        run: dotnet list ArchiveCore.slnx package --outdated --highest-patch || true

  frontend:
    name: Frontend (lint, build, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: npm audit, runtime dependencies (fails on any High/Critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit, full tree (fails on High/Critical without a documented exception)
        run: npm run audit:gate

  docker:
    name: Docker clean boot + end-to-end smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway secrets (.env)
        run: |
          cp .env.example .env
          SA="Sa1!$(openssl rand -hex 16)"
          ADMIN_PASSWORD="Adm1!$(openssl rand -hex 16)"
          {
            echo "ARCHIVECORE_SQL_SA_PASSWORD=$SA"
            echo "ARCHIVECORE_JWT_SIGNING_KEY=$(openssl rand -base64 48 | tr -d '\n')"
            echo "ARCHIVECORE_BOOTSTRAP_ADMIN_ENABLED=true"
            echo "ARCHIVECORE_BOOTSTRAP_ADMIN_EMAIL=admin@archivecore.test"
            echo "ARCHIVECORE_BOOTSTRAP_ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } >> .env
          echo "::add-mask::$SA"
          echo "::add-mask::$ADMIN_PASSWORD"

      - name: docker compose config
        run: docker compose config --quiet

      - name: docker compose build
        run: docker compose build

      - name: Clean boot (down -v, up)
        run: |
          docker compose down -v
          docker compose up -d
          docker compose ps

      - name: Database initialization result
        run: |
          docker compose logs --no-color db-init
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q db-init)")" = "0"
          docker compose logs --no-color db-init | grep -q "ArchiveCore database validation passed."

      - name: End-to-end smoke through Nginx
        run: |
          set -a; . ./.env; set +a
          ./scripts/docker-smoke.sh

      - name: Restart keeps volumes (no re-initialization)
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 40); do curl -sf http://localhost:5173/health && break; sleep 3; done
          docker compose logs --no-color db-init | grep -q "already exists"
          curl -sf http://localhost:5173/health

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
